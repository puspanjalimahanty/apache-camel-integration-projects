spring.application.name=SftpRestIntegration

server.port=8085

camel.main.run-controller=true

# Logging
logging.level.root=INFO
logging.level.com.example.sftprest=DEBUG
logging.level.org.apache.camel=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SFTP source configuration
app.sftp.host=localhost
app.sftp.port=2222
app.sftp.username=cameluser
app.sftp.password=camel123
app.sftp.directory=/incoming