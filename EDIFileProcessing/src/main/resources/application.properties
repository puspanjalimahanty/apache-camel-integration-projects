spring.application.name=EDIFileProcessing
server.port=8087

# H2 Database
spring.datasource.url=jdbc:h2:mem:edidb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# EDI file locations
app.edi.input-directory=C:/CamelProject/edi-file-processing/incoming
app.edi.processed-directory=C:/CamelProject/edi-file-processing/processed
app.edi.error-directory=C:/CamelProject/edi-file-processing/error
app.edi.duplicate-directory=C:/CamelProject/edi-file-processing/duplicate

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always