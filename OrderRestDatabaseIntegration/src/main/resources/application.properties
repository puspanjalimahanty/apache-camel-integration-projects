spring.application.name=order-rest-database-integration

# Server
server.port=8081

# H2 Database - development and testing
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console - local development only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Apache Camel
camel.main.name=order-rest-database-integration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Application information
info.app.name=Order REST Database Integration
info.app.description=REST API for order persistence
info.app.version=1.0.0