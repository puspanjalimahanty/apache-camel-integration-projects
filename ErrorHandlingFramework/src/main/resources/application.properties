spring.application.name=ErrorHandlingFramework


server.port=8081

# File locations
app.file.input-directory=C:/CamelProject/camel-error-handling/incoming
app.file.processed-directory=C:/CamelProject/camel-error-handling/processed
app.file.error-directory=C:/CamelProject/camel-error-handling/error
app.file.dead-letter-directory=C:/CamelProject/camel-error-handling/dead-letter

# Error handling
app.error.max-redeliveries=3
app.error.redelivery-delay=2000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.org.apache.camel=INFO