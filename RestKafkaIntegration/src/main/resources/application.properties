spring.application.name=RestKafkaIntegration

server.port=8081

# Kafka Broker Configuration
camel.component.kafka.brokers=localhost:9092

# Kafka Topic
app.kafka.topic=orders

# Kafka Producer Configuration
app.kafka.retry-count=3
app.kafka.retry-delay=2000

# Actuator Health Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.example.restkafka=DEBUG
logging.level.org.apache.camel=INFO


# H2 Database
spring.datasource.url=jdbc:h2:file:./data/orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka Producer Reliability
camel.component.kafka.configuration.retries=3
camel.component.kafka.configuration.retry-backoff-ms=2000
camel.component.kafka.configuration.enable-idempotence=true
camel.component.kafka.configuration.delivery-timeout-ms=120000

